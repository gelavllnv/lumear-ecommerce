<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — Lumear</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Exact "Maroon + Beige" palette: 62191C · 873632 · 9E7161 · CAAE9F · E0CFC2
                        cream:  { 50:'#FBF5F1', 100:'#F3E4DA', 200:'#E0CFC2', 300:'#CAAE9F' },
                        sand:   { 400:'#CAAE9F', 500:'#9E7161' },
                        maroon: { 950:'#3D0F11', 900:'#62191C', 800:'#62191C', 700:'#873632', 600:'#873632', 500:'#9E7161', 400:'#9E7161' },
                        gold:   { 500:'#9E7161', 400:'#CAAE9F' },
                    },
                    fontFamily: {
                        display: ['"Fraunces"', 'serif'],
                        body: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    boxShadow: { soft: '0 12px 32px -12px rgba(46,10,19,.18)', lift: '0 24px 60px -16px rgba(15,3,6,.45)' },
                },
            },
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        html { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-display { font-family: 'Fraunces', serif; }
        ::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; -ms-overflow-style: none; }
        [x-cloak] { display: none !important; }

        /* Keep Chrome/Safari autofill on-palette instead of their default blue tint */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
            -webkit-text-fill-color: #62191C;
            -webkit-box-shadow: 0 0 0px 1000px #F3E4DA inset;
            box-shadow: 0 0 0px 1000px #F3E4DA inset;
            transition: background-color 9999s ease-in-out 0s;
        }
        .link-grow { position: relative; }
        .link-grow::after { content:''; position:absolute; left:0; bottom:-2px; width:0; height:1.5px; background:currentColor; transition:width .3s cubic-bezier(.16,1,.3,1); }
        .link-grow:hover::after { width:100%; }

        /* Texture: faint dot grid over the maroon field, Shopee-esque without copying its orange */
        .dot-field {
            background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
            background-size: 22px 22px;
        }
    </style>
</head>
<body class="bg-cream-50 antialiased">

<div class="min-h-screen flex flex-col">

    
    <div class="h-16 shrink-0 bg-cream-50 border-b border-sand-400/40 flex items-center justify-between px-6 md:px-10">
        <div class="flex items-center gap-3">
            <a href="/" class="flex items-center gap-2">
                <img src="/images/lumear-logo.png" alt="Lumear" class="w-8 h-8 rounded-full object-contain">
                <span class="font-display italic text-lg text-maroon-800">Lumear</span>
            </a>
            <span class="text-sand-400 text-lg font-light">|</span>
            <span class="text-maroon-900/70 text-sm">Log In</span>
        </div>
        <a href="#" class="text-sm text-maroon-700 font-medium link-grow">Need help?</a>
    </div>

    
    <div class="flex-1 relative overflow-hidden dot-field bg-gradient-to-br from-maroon-800 via-maroon-900 to-maroon-950">

        <div class="absolute -top-32 -left-32 w-[30rem] h-[30rem] rounded-full bg-maroon-700/40 blur-3xl"></div>
        <div class="absolute -bottom-40 -right-20 w-[26rem] h-[26rem] rounded-full bg-gold-500/10 blur-3xl"></div>

        <div class="relative z-10 h-full flex items-center justify-center px-6 md:px-12 py-10">
            <div class="w-full max-w-6xl flex items-center justify-between gap-10">
                <div x-data="authCarousel()" x-init="start()" class="hidden lg:flex flex-col items-center justify-center relative z-10 w-[420px] shrink-0">

    <div class="relative w-72 h-[420px]">
        <template x-for="(slide, i) in slides" :key="i">
            <div x-show="active === i"
                 x-transition:enter="transition ease-out duration-500"
                 x-transition:enter-start="opacity-0 translate-y-3"
                 x-transition:enter-end="opacity-100 translate-y-0"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="opacity-100"
                 x-transition:leave-end="opacity-0"
                 class="absolute inset-0">

                
                <div class="w-full h-full rounded-[2.5rem] bg-cream-50/95 border-[6px] border-maroon-950/40 shadow-lift overflow-hidden flex flex-col">
                    <div class="h-6 flex items-center justify-center shrink-0">
                        <div class="w-16 h-1.5 rounded-full bg-maroon-900/15"></div>
                    </div>
                    <div class="flex-1 grid place-items-center text-7xl" x-text="slide.emoji"></div>
                    <div class="px-6 pb-8">
                        <div class="h-2 w-3/4 rounded-full bg-maroon-900/10 mb-2"></div>
                        <div class="h-2 w-1/2 rounded-full bg-maroon-900/10"></div>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <div class="mt-8 text-center">
        <template x-for="(slide, i) in slides" :key="'t'+i">
            <div x-show="active === i">
                <p class="font-display italic text-2xl text-cream-50" x-text="slide.title"></p>
                <p class="text-sm text-cream-100/60 mt-2 max-w-[26ch] mx-auto" x-text="slide.copy"></p>
            </div>
        </template>
    </div>

    <div class="flex items-center gap-2 mt-6">
        <template x-for="(slide, i) in slides" :key="'d'+i">
            <button @click="active = i" class="h-1.5 rounded-full transition-all duration-300" :class="active === i ? 'w-6 bg-gold-400' : 'w-1.5 bg-cream-50/30'"></button>
        </template>
    </div>
</div>

<script>
    function authCarousel() {
        return {
            active: 0,
            slides: [
                { emoji: '🚚', title: 'Free shipping', copy: 'On your first order across every category, every week.' },
                { emoji: '⚡', title: 'Flash deals', copy: 'New drops every hour — limited stock, real savings.' },
                { emoji: '🛍️', title: '12 categories', copy: 'From pet bowls to gold hoops, all under one roof.' },
                { emoji: '📦', title: 'Live tracking', copy: 'Watch your order move from shop to doorstep.' },
            ],
            start() {
                setInterval(() => { this.active = (this.active + 1) % this.slides.length }, 4000);
            }
        }
    }
</script>
                <div class="w-full max-w-[420px] shrink-0 ml-auto">
                    <div class="bg-cream-50 rounded-lg shadow-lift p-8 md:p-9">
                        <div x-data="{ showPw: false, identity: '' }">

    <h1 class="font-display text-[26px] text-maroon-900 leading-tight">Log In</h1>

    
    <form method="POST" action="/login/" class="mt-7 space-y-4"
          @submit.prevent="localStorage.setItem('lumear_identity', identity); window.location.href = '/home/'">
        <input type="hidden" name="_token" value="91s5i9S3ao2uWpwd9sHEVkFoaSnSq6p6TBnMpUu1" autocomplete="off">
        
        <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-maroon-900/35">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
            </span>
            <input type="text" name="login" x-model="identity" required placeholder="Email or contact number"
                   class="w-full h-12 rounded-xl bg-sand-400/15 border border-sand-400/50 pl-11 pr-4 text-sm outline-none
                          focus:border-maroon-600 focus:bg-cream-50 transition-colors duration-200">
        </div>

        
        <div class="flex items-center gap-3">
            <div class="relative flex-1 min-w-0">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-maroon-900/35">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 10-8 0v4h8z"/>
                    </svg>
                </span>
                <input :type="showPw ? 'text' : 'password'" name="password" required placeholder="Password"
                       class="w-full h-12 rounded-xl bg-sand-400/15 border border-sand-400/50 pl-11 pr-11 text-sm outline-none
                              focus:border-maroon-600 focus:bg-cream-50 transition-colors duration-200">
                <button type="button" @click="showPw = !showPw" class="absolute right-4 top-1/2 -translate-y-1/2 text-maroon-900/35 hover:text-maroon-700 transition-colors">
                    <svg x-show="!showPw" xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                    <svg x-show="showPw" x-cloak xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12c1.292 4.338 5.31 7.5 10.066 7.5.847 0 1.67-.105 2.454-.303M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/>
                    </svg>
                </button>
            </div>
            <a href="#" class="text-xs text-maroon-700 font-semibold link-grow shrink-0">Forgot?</a>
        </div>

        <button type="submit" class="w-full h-12 rounded-xl bg-maroon-700 text-cream-50 font-bold text-sm tracking-wide hover:bg-maroon-600 hover:shadow-lift transition-all duration-300">
            LOG IN
        </button>

        <label class="flex items-center gap-2 text-xs text-maroon-900/55 pt-1">
            <input type="checkbox" checked class="w-4 h-4 rounded accent-maroon-700">
            Stay signed in
            <span title="Keeps you logged in on this device until you log out manually." class="text-maroon-900/30 cursor-help">ⓘ</span>
        </label>
    </form>

    <div class="flex items-center gap-3 my-6">
        <div class="flex-1 h-px bg-sand-400/40"></div>
        <span class="text-[11px] text-maroon-900/40 font-medium">OR</span>
        <div class="flex-1 h-px bg-sand-400/40"></div>
    </div>

    
    <button type="button" @click="localStorage.setItem('lumear_identity', 'Google Account'); window.location.href = '/home/'"
            class="w-full h-12 rounded-xl border border-sand-400/60 flex items-center justify-center gap-2.5 text-sm font-semibold text-maroon-800 hover:border-maroon-600 hover:bg-sand-400/15 transition-colors duration-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.5 12.27c0-.79-.07-1.54-.2-2.27H12v4.3h6.47a5.54 5.54 0 01-2.4 3.63v3h3.87c2.27-2.09 3.56-5.17 3.56-8.66z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.96-1.08 7.94-2.93l-3.87-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.28v3.09A12 12 0 0012 24z"/>
            <path fill="#FBBC05" d="M5.27 14.26a7.2 7.2 0 010-4.52V6.65H1.28a12 12 0 000 10.7l3.99-3.09z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0A12 12 0 001.28 6.65l3.99 3.09C6.22 6.86 8.87 4.75 12 4.75z"/>
        </svg>
        Continue with Google
    </button>

    <p class="text-center text-sm text-maroon-900/60 mt-7">
        New to Lumear? <a href="/register/" class="text-maroon-700 font-bold link-grow">Sign up</a>
    </p>
</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
