services:
  app:
    build: .
    env_file: .env
    depends_on: [mysql, redis, meilisearch, minio]
    volumes:
      - ./:/var/www/html
    networks: [lumear]

  nginx:
    image: nginx:1.27-alpine
    ports: ["8000:80"]
    depends_on: [app]
    volumes:
      - ./:/var/www/html:ro
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [lumear]

  worker:
    build: .
    command: php artisan queue:work --tries=3 --timeout=90
    env_file: .env
    depends_on: [app, mysql, redis]
    volumes: ["./:/var/www/html"]
    networks: [lumear]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: lumear_ecommerce
      MYSQL_USER: lumear
      MYSQL_PASSWORD: lumear_local_change_me
      MYSQL_ROOT_PASSWORD: root_local_change_me
    ports: ["3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    networks: [lumear]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    networks: [lumear]

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment: ["MEILI_NO_ANALYTICS=true", "MEILI_MASTER_KEY=development-change-me"]
    ports: ["7700:7700"]
    volumes: ["meilisearch-data:/meili_data"]
    networks: [lumear]

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: lumear_minio
      MINIO_ROOT_PASSWORD: development-change-me
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    networks: [lumear]

networks:
  lumear:

volumes:
  mysql-data:
  meilisearch-data:
  minio-data:
